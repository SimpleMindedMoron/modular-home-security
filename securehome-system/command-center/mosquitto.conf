# =====================================================
# SecureHome Mosquitto MQTT Broker Configuration
# Note: SecureHome uses HiveMQ Cloud as its primary broker
# for cross-network remote access (TLS port 8883 / WSS port 8884).
# This configuration is retained as an optional local-only
# fallback for isolated LAN or offline edge deployments.
# =====================================================

# 1. Standard TCP listener for ESP32 nodes & Python AI processor
listener 1883 0.0.0.0
allow_anonymous true

# 2. WebSockets listener for Next.js Web Dashboard browser client
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
